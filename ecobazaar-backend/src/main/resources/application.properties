# ================================================
# EcoBazaar Backend - Application Configuration
#
# All sensitive values use environment variable fallbacks:
#   ${VAR_NAME:default_value}
# Set the real values as environment variables in production.
# For local development the defaults below are used automatically.
# ================================================

# Server Configuration
server.port=8080

# ------------------------------------------------
# Database Configuration (PostgreSQL)
# Override in production via environment variables:
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# ------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/EcoBazar2}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------
# Hibernate / JPA Configuration
# ------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ------------------------------------------------
# Frontend URL (used in CORS configuration)
# Override in production via: FRONTEND_URL
# ------------------------------------------------
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ------------------------------------------------
# JWT Configuration
# Override in production via: JWT_SECRET
# Default is a local-dev-only placeholder (>= 256-bit).
# IMPORTANT: Use a strong, unique secret in production!
# ------------------------------------------------
jwt.secret=${JWT_SECRET:ecobazaar_default_dev_secret_key_minimum_256_bits_for_local_development_only}
jwt.expiration=86400000

# ------------------------------------------------
# File Upload Limits (for base64 image payloads)
# ------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------
# Jackson JSON Serialization
# ------------------------------------------------
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.fail-on-self-references=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent_output=true
